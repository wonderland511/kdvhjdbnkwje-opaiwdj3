<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Чек-лист аренды</title>
<meta name="robots" content="noindex, nofollow, noarchive, nosnippet, noimageindex">
<meta name="googlebot" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600&family=Unbounded:wght@500;700&display=swap">
<style>
:root{
  --bg:#EDF1EE; --surface:#FFFFFF; --sunk:#E2E8E4; --ink:#14201A; --muted:#56665E;
  --line:#D3DCD6; --accent:#1D6A55; --accent-ink:#FFFFFF; --accent-soft:#D6EBE3;
  --brass:#946A12; --danger:#B03A2E;
  --display:"Unbounded", "Onest", system-ui, sans-serif;
  --body:"Onest", -apple-system, "Segoe UI", Roboto, system-ui, sans-serif;
  --r:16px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0E1512; --surface:#16201C; --sunk:#1D2925; --ink:#E6EEEA; --muted:#98A9A1;
    --line:#2A3833; --accent:#5CC4A5; --accent-ink:#0A1A14; --accent-soft:#1C3A30;
    --brass:#D9B25A; --danger:#F07A6C; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0E1512; --surface:#16201C; --sunk:#1D2925; --ink:#E6EEEA; --muted:#98A9A1;
  --line:#2A3833; --accent:#5CC4A5; --accent-ink:#0A1A14; --accent-soft:#1C3A30;
  --brass:#D9B25A; --danger:#F07A6C; color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg); color:var(--ink); font:16px/1.5 var(--body); margin:0; -webkit-font-smoothing:antialiased}
.wrap{max-width:720px; margin:0 auto; padding-inline:16px; padding-block:28px 64px}
h1,h2{font-family:var(--display); text-wrap:balance; margin:0; letter-spacing:-.02em}
h1{font-size:clamp(30px,7vw,44px); font-weight:700; line-height:1.08}
h2{font-size:19px; font-weight:500; line-height:1.25}
p{margin:0}
button{font:inherit; color:inherit}
:focus-visible{outline:3px solid var(--accent); outline-offset:2px; border-radius:10px}

@keyframes fadeInUp{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
.top,.progress,.group,.msg,.foot,.lock-card{animation:fadeInUp .5s ease-out both}
.progress{animation-delay:.05s} .group{animation-delay:.1s} .msg{animation-delay:.15s}
@media (prefers-reduced-motion: reduce){
  .top,.progress,.group,.msg,.foot,.lock-card{animation:none;opacity:1;transform:none}
}

/* Экран пароля */
.lock{min-height:100%; display:grid; place-items:center; padding-block:12vh 40px}
.lock-card{width:100%; max-width:400px; background:var(--surface); border:1px solid var(--line); border-radius:24px; padding:28px 24px; display:grid; gap:18px}
.lock-icon{width:52px; height:52px; border-radius:14px; background:var(--accent-soft); display:grid; place-items:center; color:var(--accent)}
.lock-card h1{font-size:26px}
.lock-card p{color:var(--muted)}
.field{display:grid; gap:6px}
.field label{font-size:13px; font-weight:600; letter-spacing:.04em; text-transform:uppercase; color:var(--muted)}
.field input{font:inherit; font-size:18px; padding:14px 16px; border-radius:12px; border:1.5px solid var(--line); background:var(--bg); color:var(--ink); min-height:52px; width:100%}
.field input:focus{outline:none; border-color:var(--accent)}
.err{color:var(--danger); font-size:14px; min-height:21px}

/* Шапка */
.top{display:grid; gap:12px; padding-block:8px 20px}
.eyebrow{font-size:13px; font-weight:600; letter-spacing:.08em; text-transform:uppercase; color:var(--brass)}
.lede{color:var(--muted); max-width:58ch}

.progress{position:sticky; top:env(safe-area-inset-top,0px); z-index:5; background:var(--bg); padding-block:12px; margin-bottom:8px}
.progress-row{display:flex; justify-content:space-between; align-items:baseline; margin-bottom:8px; font-size:14px}
.progress-label{font-weight:600; letter-spacing:.04em; text-transform:uppercase; color:var(--muted); font-size:12px}
.progress-count{font-variant-numeric:tabular-nums; color:var(--muted)}
.progress-count b{color:var(--ink); font-size:18px}
.bar{height:6px; border-radius:6px; background:var(--sunk); overflow:hidden}
.bar i{display:block; height:100%; width:0; background:var(--accent); border-radius:6px; transition:width .35s ease}

/* Группы */
.group,.msg{display:grid; gap:10px; margin-top:28px}
.group-head{display:grid; gap:4px; padding-inline:4px; margin-bottom:4px}
.group-head p{color:var(--muted); font-size:15px}
.with-sticker{grid-template-columns:1fr auto; align-items:end; gap:12px}
.sticker{margin:0 0 -18px; width:104px; height:104px; border-radius:50%; overflow:hidden; border:4px solid var(--surface); box-shadow:0 6px 18px rgba(0,0,0,.14); transform:rotate(-6deg); position:relative; z-index:1; pointer-events:auto}
.sticker img{width:100%; height:100%; object-fit:cover; display:block}

.subhead{font-size:12px; font-weight:600; letter-spacing:.08em; text-transform:uppercase; color:var(--brass); margin:18px 0 2px; padding-inline:4px}
.group-head + .subhead{margin-top:6px}
.item{background:var(--surface); border:1px solid var(--line); border-radius:var(--r); transition:border-color .2s, background-color .2s}
.item.done{border-color:color-mix(in srgb, var(--accent) 45%, var(--line))}
.row{display:grid; grid-template-columns:28px 1fr; gap:14px; align-items:start; padding:18px 18px; cursor:pointer; min-height:72px; -webkit-tap-highlight-color:transparent}
.check{position:absolute; opacity:0; width:1px; height:1px; pointer-events:none}
.box{width:28px; height:28px; border-radius:9px; border:2px solid var(--line); background:var(--bg); display:grid; place-items:center; transition:background-color .2s, border-color .2s; margin-top:1px}
.box::after{content:""; width:12px; height:7px; border-left:3px solid var(--accent-ink); border-bottom:3px solid var(--accent-ink); transform:rotate(-45deg) translate(1px,-1px) scale(0); transition:transform .18s ease}
.check:checked + .box{background:var(--accent); border-color:var(--accent)}
.check:checked + .box::after{transform:rotate(-45deg) translate(1px,-1px) scale(1)}
.check:focus-visible + .box{outline:3px solid var(--accent); outline-offset:2px}
.txt{display:grid; gap:3px; min-width:0; overflow-wrap:anywhere}
.t{font-weight:600; font-size:17px; line-height:1.35}
.d{color:var(--muted); font-size:15px}
.item.done .t{color:var(--muted)}
.spec{font-family:var(--display); font-weight:500; color:var(--brass); font-variant-numeric:tabular-nums}

.extra{padding:0 18px 18px 60px}
.keys{display:flex; flex-wrap:wrap; align-items:center; gap:10px 16px}
.extra-label{font-size:12px; font-weight:600; letter-spacing:.06em; text-transform:uppercase; color:var(--muted)}
.stepper{display:flex; align-items:center; background:var(--sunk); border-radius:12px; padding:3px}
.step{width:44px; height:44px; border:0; border-radius:10px; background:transparent; font-size:22px; cursor:pointer}
.step:hover{background:var(--surface)}
.num{min-width:34px; text-align:center; font-family:var(--display); font-weight:500; font-size:18px; font-variant-numeric:tabular-nums}
.keys-need{font-size:15px; color:var(--muted)}
.keys-need b{color:var(--brass); font-weight:600}

.season{display:flex; flex-wrap:wrap; gap:4px; background:var(--sunk); border-radius:12px; padding:3px; margin:0 18px 18px 60px}
.extra.season{padding:3px}
.seg{flex:1 1 180px; min-height:44px; padding:8px 12px; border:0; border-radius:10px; background:transparent; color:var(--muted); font-size:15px; font-weight:500; cursor:pointer}
.seg[aria-pressed="true"]{background:var(--accent-soft); color:var(--ink); font-weight:600; box-shadow:inset 0 0 0 1.5px var(--accent)}
.chips{display:flex; flex-wrap:wrap; gap:8px}
.chip{position:relative; cursor:pointer}
.chip input{position:absolute; opacity:0; width:1px; height:1px}
.chip span{display:inline-flex; align-items:center; min-height:40px; padding:8px 14px; border-radius:999px; border:1.5px solid var(--line); background:var(--bg); font-size:15px; transition:background-color .2s, border-color .2s, color .2s}
.chip input:checked + span{background:var(--accent-soft); border-color:var(--accent); color:var(--ink)}
.chip input:checked + span::before{content:""; width:8px; height:5px; margin-right:8px; border-left:2px solid var(--accent); border-bottom:2px solid var(--accent); transform:rotate(-45deg) translateY(-2px)}
.chip input:focus-visible + span{outline:3px solid var(--accent); outline-offset:2px}

/* Сообщение */
textarea{width:100%; font:inherit; font-size:15px; line-height:1.55; padding:16px; border-radius:var(--r); border:1px solid var(--line); background:var(--surface); color:var(--ink); resize:vertical; min-height:180px}
textarea:focus{outline:none; border-color:var(--accent)}
.actions,.confirm{display:flex; flex-wrap:wrap; gap:10px; align-items:center}
.confirm{padding:14px 16px; background:var(--surface); border:1px solid var(--line); border-radius:var(--r)}
.confirm span{font-weight:600; margin-right:auto}
.btn{min-height:52px; padding:12px 22px; border-radius:14px; border:1.5px solid transparent; font-weight:600; font-size:16px; cursor:pointer}
.btn.primary{background:var(--accent); color:var(--accent-ink)}
.btn.ghost{background:transparent; border-color:var(--line)}
.btn.danger{background:var(--danger); color:#fff}
.lock-card .btn{width:100%}
.toast{min-height:22px; font-size:14px; color:var(--accent); font-weight:600}

.foot{margin-top:36px; display:grid; gap:6px; color:var(--muted); font-size:13px; padding-inline:4px}
.foot a{color:inherit}
.link{justify-self:start; background:none; border:0; padding:8px 0; color:var(--accent); font-weight:600; cursor:pointer; min-height:44px}

@media (max-width:480px){
  .extra{padding-left:18px}
  .season{margin-left:16px; margin-right:16px}
  .extra.season{padding:3px}
  .row{padding:16px}
  .sticker{width:88px; height:88px}
}
</style>

</head>
<body>
<div class="wrap">
  <main id="lock" class="lock">
    <form class="lock-card" id="lockForm" autocomplete="on">
      <div class="lock-icon" aria-hidden="true">
        <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="8" cy="15" r="4"/><path d="M10.8 12.2 20 3"/><path d="m16 7 3 3"/><path d="m18 5 2 2"/></svg>
      </div>
      <h1>Чек-лист аренды</h1>
      <p>Страница закрыта. Введите пароль.</p>
      <input type="text" name="username" value="чек-лист аренды" autocomplete="username" hidden>
      <div class="field">
        <label for="pw">Пароль</label>
        <input id="pw" type="password" autocomplete="current-password" required>
      </div>
      <p class="err" id="err" role="alert"></p>
      <button class="btn primary" type="submit" id="unlockBtn">Открыть</button>
    </form>
  </main>
  <div id="app" hidden></div>
  <noscript><p style="padding:24px">Для открытия чек-листа нужен JavaScript.</p></noscript>
</div>

<script>
(function(){
  var P = window.__PAYLOAD__;
  var STORE = "rent-checklist-v1", SESS = "rent-checklist-pw";
  function b64(s){ var bin = atob(s), a = new Uint8Array(bin.length); for (var i=0;i<bin.length;i++) a[i]=bin.charCodeAt(i); return a; }
  function load(){ try { return JSON.parse(localStorage.getItem(STORE)) || {}; } catch(e){ return {}; } }
  function save(s){ try { localStorage.setItem(STORE, JSON.stringify(s)); } catch(e){} }

  async function decrypt(pw){
    var enc = new TextEncoder();
    var base = await crypto.subtle.importKey("raw", enc.encode(pw), "PBKDF2", false, ["deriveKey"]);
    var key = await crypto.subtle.deriveKey({name:"PBKDF2", salt:b64(P.salt), iterations:P.iter, hash:"SHA-256"}, base, {name:"AES-GCM", length:256}, false, ["decrypt"]);
    var plain = await crypto.subtle.decrypt({name:"AES-GCM", iv:b64(P.iv)}, key, b64(P.ct));
    return new TextDecoder().decode(plain);
  }

  var form = document.getElementById("lockForm"), err = document.getElementById("err"), pw = document.getElementById("pw");
  async function tryOpen(value, silent){
    try {
      var html = await decrypt(value);
      try { sessionStorage.setItem(SESS, value); } catch(e){}
      document.getElementById("lock").hidden = true;
      var app = document.getElementById("app");
      app.innerHTML = html; app.hidden = false;
      initApp();
      return true;
    } catch(e){
      if (!silent){ err.textContent = "Пароль не подошёл. Проверьте раскладку и регистр."; pw.select(); }
      return false;
    }
  }
  form.addEventListener("submit", function(e){ e.preventDefault(); err.textContent = ""; tryOpen(pw.value, false); });
  try { var saved = sessionStorage.getItem(SESS); if (saved) tryOpen(saved, true); } catch(e){}

  function plural(n){ var m10=n%10, m100=n%100; if (m10===1 && m100!==11) return "комплект"; if (m10>=2 && m10<=4 && (m100<12||m100>14)) return "комплекта"; return "комплектов"; }
  function pluralPeople(n){ var m10=n%10, m100=n%100; return (m10>=2 && m10<=4 && (m100<12||m100>14)) ? "человека" : "человек"; }

  function initApp(){
    var state = load(); state.items = state.items || {}; state.chips = state.chips || {}; state.residents = state.residents || 2;
    var items = [].slice.call(document.querySelectorAll(".item"));
    var chips = [].slice.call(document.querySelectorAll("[data-chip]"));
    var segs = [].slice.call(document.querySelectorAll("[data-season]"));
    if (state.season !== "warm" && state.season !== "cold"){ var mo = new Date().getMonth() + 1; state.season = (mo >= 5 && mo <= 9) ? "warm" : "cold"; }
    var msg = document.getElementById("msgText"), msgDirty = false;
    document.getElementById("totalCount").textContent = items.length;

    items.forEach(function(it){ var c = it.querySelector(".check"); c.checked = !!state.items[it.dataset.id]; });
    chips.forEach(function(c){ c.checked = !!state.chips[c.dataset.chip]; });

    function itemChips(it){ return [].slice.call(it.querySelectorAll("[data-chip]")); }
    function askFor(it){
      var a = it.dataset.ask, n = state.residents, ch = itemChips(it);
      if (a === "keys") return "Сколько комплектов ключей вы дадите? Нас будет " + n + " " + pluralPeople(n) + ", нужно " + n + " " + plural(n) + ".";
      if (a === "climate") return state.season === "warm" ? "Есть ли кондиционер и работает ли он сейчас?" : "Работают ли батареи, тепло ли в квартире?";
      if (ch.length){
        var miss = ch.filter(function(c){ return !c.checked; }).map(function(c){ return c.dataset.chip; });
        return miss.length ? a + " " + miss.join(", ") + "?" : "";
      }
      return a;
    }
    function render(){
      var done = 0;
      items.forEach(function(it){ var on = it.querySelector(".check").checked; it.classList.toggle("done", on); if (on) done++; });
      document.getElementById("doneCount").textContent = done;
      document.getElementById("barFill").style.width = (done / items.length * 100) + "%";
      var n = state.residents;
      document.getElementById("residents").textContent = n;
      document.getElementById("keysNeed").textContent = n + " " + plural(n);
      segs.forEach(function(b){ b.setAttribute("aria-pressed", String(b.dataset.season === state.season)); });
      if (!msgDirty){
        var qs = items.filter(function(it){ return !it.querySelector(".check").checked; }).map(askFor).filter(Boolean);
        msg.value = qs.length
          ? "Здравствуйте! Рассматриваем вашу квартиру. \n\nПрежде чем бронировать, уточните, пожалуйста:\n\n" + qs.map(function(q,i){ return (i+1) + ". " + q; }).join("\n") + "\n\nСпасибо!"
          : "Все пункты подтверждены, вопросов к собственнику нет.";
      }
    }
    function persist(){
      items.forEach(function(it){ state.items[it.dataset.id] = it.querySelector(".check").checked; });
      chips.forEach(function(c){ state.chips[c.dataset.chip] = c.checked; });
      save(state);
    }
    document.getElementById("app").addEventListener("change", function(e){
      var t = e.target;
      var it = t.closest(".item"), ch = it ? itemChips(it) : [];
      if (ch.length){
        if (t.dataset.chip !== undefined) it.querySelector(".check").checked = ch.every(function(c){ return c.checked; });
        else if (t.classList.contains("check")) ch.forEach(function(c){ c.checked = t.checked; });
      }
      msgDirty = false; persist(); render();
    });
    msg.addEventListener("input", function(){ msgDirty = true; });
    function setRes(d){ state.residents = Math.min(12, Math.max(1, state.residents + d)); msgDirty = false; save(state); render(); }
    document.getElementById("resMinus").addEventListener("click", function(){ setRes(-1); });
    document.getElementById("resPlus").addEventListener("click", function(){ setRes(1); });
    segs.forEach(function(b){ b.addEventListener("click", function(){ state.season = b.dataset.season; msgDirty = false; save(state); render(); }); });

    var toast = document.getElementById("toast"), tt;
    function say(t){ toast.textContent = t; clearTimeout(tt); tt = setTimeout(function(){ toast.textContent = ""; }, 2600); }
    document.getElementById("copyBtn").addEventListener("click", function(){
      var text = msg.value;
      var fallback = function(){ msg.focus(); msg.select(); say("Текст выделен, нажмите «Копировать» в меню или ⌘C."); };
      try {
        navigator.clipboard.writeText(text).then(function(){ say("Сообщение скопировано."); }, fallback);
      } catch(e){ fallback(); }
    });
    var conf = document.getElementById("resetConfirm");
    document.getElementById("resetBtn").addEventListener("click", function(){ conf.hidden = false; document.getElementById("resetNo").focus(); });
    document.getElementById("resetNo").addEventListener("click", function(){ conf.hidden = true; });
    document.getElementById("resetYes").addEventListener("click", function(){
      items.forEach(function(it){ it.querySelector(".check").checked = false; });
      chips.forEach(function(c){ c.checked = false; });
      conf.hidden = true; msgDirty = false; persist(); render(); say("Отметки очищены.");
    });
    document.getElementById("lockBtn").addEventListener("click", function(){
      try { sessionStorage.removeItem(SESS); } catch(e){}
      location.reload();
    });
    render();
    if (window.__motionReady) window.__motionReady();
  }
})();
</script>
<script type="module">
(async () => {
  try {
    if (matchMedia("(prefers-reduced-motion: reduce)").matches) return;
    const { animate } = await import("https://cdn.jsdelivr.net/npm/motion@11.11.17/+esm");
    const spring = { type: "spring", stiffness: 420, damping: 22 };
    const bind = () => {
      document.querySelectorAll(".item .row, .btn, .chip span, .step, .sticker").forEach((el) => {
        if (el.dataset.m) return; el.dataset.m = "1";
        const down = el.classList.contains("sticker") ? { rotate: 4, scale: 1.08 } : { scale: 0.97 };
        const up = el.classList.contains("sticker") ? { rotate: -6, scale: 1 } : { scale: 1 };
        el.addEventListener("pointerdown", () => animate(el, down, spring));
        el.addEventListener("pointerup", () => animate(el, up, spring));
        el.addEventListener("pointerleave", () => animate(el, up, spring));
      });
      const s = document.querySelector(".sticker");
      if (s) s.addEventListener("pointerenter", () => animate(s, { rotate: [-6, 5, -3, -6] }, { duration: 0.7 }));
    };
    window.__motionReady = bind;
    bind();
  } catch (e) {}
})();
</script>
